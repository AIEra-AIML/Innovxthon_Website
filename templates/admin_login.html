<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="admin-login">

    <div class="admin-box">

        <div class="badge">
            INNOVXTHON 2026
        </div>

        <h1>
            Admin Login
        </h1>

        <p>
            Access allocation dashboard.
        </p>

        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="Admin password"
                required
            >

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <button type="submit">
                Login →
            </button>

        </form>

    </div>

</div>

</body>
</html>
